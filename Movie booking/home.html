<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking System</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input { display: block; margin: 8px 0; padding: 8px; width: 250px; }
        button { padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer; }
        .error { color: red; }
    </style>
</head>
<body>

    <h2>Movie Ticket Booking System</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/search" method="POST">

        <label>Customer Name:</label>
        <input type="text" name="name" placeholder="Enter your name">

        <label>Movie Name:</label>
        <input type="text" name="movie" placeholder="Leo / GOAT / Vikram">

        <label>Number of Tickets:</label>
        <input type="number" name="tickets" placeholder="Enter tickets">

        <button type="submit">Book Ticket</button>

    </form>

</body>
</html>
